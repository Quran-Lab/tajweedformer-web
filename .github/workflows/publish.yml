name: Publish to npm

# Started by hand on a tag (Actions, Publish to npm, Run workflow, Use workflow from: Tags), with the engine build the
# package is published with.
#
# SDK 4.0: the package is the hosted loader's thin wrapper for browsers and the Node path for desktop apps, never the
# engine or the model. The Node entry names one built-in engine build (sdk4/node/engine.js BUILTIN_ENGINE, null in the
# source), its last choice after the signed config's web.engine and its previous. scripts/stamp-engine.mjs sets it here,
# and only to a build web.quranlab.ai serves whose index.json verifies with the pinned key, names the same id and has
# the one-thread variant: give the build web.quranlab.ai serves to every site now.
#
# A published version cannot be published again, so everything that can fail comes before the last step.

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "The engine build the Node entry starts with (yyyymmdd.<12 hex>): the build web.quranlab.ai serves now"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Test, stamp the engine, check and publish @quran-lab/tajweedformer
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the package version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "$v" ] || { echo "tag $GITHUB_REF_NAME is not the package version $v" >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Dev dependencies (no lockfile in this repository)
        run: npm install --no-audit --no-fund --no-save
      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.11
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.11
      - name: libopus for the sharing tests (built first, so no sharing test ever skips)
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run build:opus
      # as ci.yml: `npm test`'s files and flags, but for three files and one test that read the contract's vectors at
      # once (QL_CONTRACT, Quran Lab's own input, absent here); they run in the development repository's CI
      - name: Tests (the loader, the frame, the Worker, the Node path, sharing; libopus required)
        run: |
          grep -q '"test": "node --max-old-space-size=2048 --test --test-concurrency=2 --test-timeout=600000 \\"test/v4/\*.test.mjs\\" \\"test/sharing_\*.test.mjs\\""' package.json \
            || { echo "::error::package.json's test script changed: update this step"; exit 1; }
          files=$(ls test/v4/*.test.mjs test/sharing_*.test.mjs | grep -vE '^test/v4/(grace|piece|vectors)\.test\.mjs$')
          REQUIRE_OPUS=1 node --max-old-space-size=2048 --test --test-concurrency=2 --test-timeout=600000 \
            --test-skip-pattern='^web_lease\.json: ' $files
      - name: The Node entry's built-in engine (verified against web.quranlab.ai and the pinned key, then stamped)
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          node scripts/stamp-engine.mjs "$ENGINE"
          changed=$(git diff --name-only)
          [ "$changed" = "sdk4/node/engine.js" ] || { echo "::error::the stamp changed: ${changed:-nothing}"; exit 1; }
          git diff
          echo "Built-in engine of the Node entry: \`$ENGINE\`" >> "$GITHUB_STEP_SUMMARY"
      - name: The README's portal links say they came from npm (sdk.quranlab.ai/go/npm-tajweedformer), not from this repository
        run: sed -i -E 's,sdk\.quranlab\.ai/go/gh-tajweedformer-web([?)"#]),sdk.quranlab.ai/go/npm-tajweedformer\1,g' README.md
      - name: What the package will contain (scripts/check-package.mjs --publish, then the list)
        run: |
          npm run check:package -- --publish
          npm pack --dry-run 2>&1 | tee "$RUNNER_TEMP/pack.txt"
      - name: The version is not on npm yet
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@quran-lab/tajweedformer@$v" version >/dev/null 2>&1; then
            echo "::error::@quran-lab/tajweedformer@$v is already published"; exit 1
          fi
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
