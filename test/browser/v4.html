<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TajweedFormer V4 browser check</title></head>
<body>
<pre id="log">running...</pre>
<script type="module">
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
const result = {};
window.__result = result;
const H0 = [0x14650fb0, 0x739d0383];
function fnv1a64(bytes, h = H0) {
  let hi = h[0], lo = h[1];
  for (let i = 0; i < bytes.length; i++) {
    lo = (lo ^ bytes[i]) >>> 0;
    const t = lo * 0x1b3;
    const carry = Math.floor(t / 4294967296);
    hi = (Math.imul(hi, 0x1b3) + ((lo << 8) >>> 0) + carry) >>> 0;
    lo = t >>> 0;
  }
  return [hi, lo];
}
const hex = ([hi, lo]) => hi.toString(16).padStart(8, '0') + lo.toString(16).padStart(8, '0');
const bytesOf = (f) => new Uint8Array(f.buffer, f.byteOffset, f.byteLength);
const OUTPUTS = ['attr_face', 'attr_ghunna', 'attr_qalqalah', 'attr_tafkheem', 'boundary', 'conf', 'gem',
  'id_log_probs', 'inter1_log_probs', 'inter4_log_probs', 'log_probs', 'timing_log_probs'];
const camel = (n) => n.replace(/_([a-z0-9])/g, (_, c) => c.toUpperCase());

try {
  // ---- first paint cost: importing the package ----
  let t = performance.now();
  const pkg = await import('/pkg/web/index.js');
  result.importMs = performance.now() - t;
  const { TajweedFormer, cacheApiStore } = pkg;
  // a clean cache for the cold measurement
  await caches.delete('quranlab-tajweedformer-v1');

  // ---- cold load: profile download over HTTP ranges, SHA-256 checks, the wasm engine ----
  t = performance.now();
  let tf = await TajweedFormer.load({ url: '/model/', context: 'c16_l64' });
  result.coldLoadMs = performance.now() - t;
  result.delivery = tf.delivery;
  result.profile = tf.profile;
  result.info = tf.info;
  tf.free();
  // ---- warm load from the Cache API ----
  t = performance.now();
  tf = await TajweedFormer.load({ url: '/model/', context: 'c16_l64' });
  result.warmLoadMs = performance.now() - t;
  result.warmDelivery = tf.delivery;
  log(`import ${result.importMs.toFixed(0)} ms, cold load ${result.coldLoadMs.toFixed(0)} ms, warm ${result.warmLoadMs.toFixed(0)} ms`);

  // ---- conformance: 35 clips, every output of every chunk ----
  const expected = (await (await fetch('/expected/v4_c16_l64_audio_expected.jsonl')).text()).split('\n').filter(Boolean).map((l) => JSON.parse(l));
  let chunks = [];
  const chunkTimes = [];
  let firstChunkMs = null;
  const s = tf.createStream({ allHeads: true, onChunk: (h) => chunks.push(h) });
  let ok = 0, decodedOk = 0, topkOk = 0, audioSeconds = 0, computeMs = 0;
  const bad = [];
  for (const e of expected) {
    const pcm = new Float32Array(await (await fetch(`/audio/${e.clip}.pcm`)).arrayBuffer());
    audioSeconds += pcm.length / 16000;
    s.reset();
    chunks = [];
    const a = performance.now();
    for (let at = 0; at < pcm.length; at += 320) {
      const c0 = performance.now();
      const n = s.pushAudio(pcm.subarray(at, Math.min(pcm.length, at + 320)));
      if (n > 0) { const dt = performance.now() - c0; chunkTimes.push(dt / n); if (firstChunkMs === null) firstChunkMs = performance.now() - a; }
    }
    s.finish();
    computeMs += performance.now() - a;
    let logp = H0;
    const outFnv = Object.fromEntries(OUTPUTS.map((k) => [k, []]));
    for (const h of chunks) {
      for (const k of OUTPUTS) outFnv[k].push(hex(fnv1a64(bytesOf(h[camel(k)]))));
      logp = fnv1a64(bytesOf(h.logProbs), logp);
    }
    const tokens = s.greedy();
    let why = null;
    if (chunks.length !== e.chunks) why = 'chunks';
    else if (JSON.stringify(tokens) !== JSON.stringify(e.tokens)) why = 'tokens';
    else if (hex(logp) !== e.logp_fnv) why = 'log_probs';
    else for (const k of OUTPUTS) { if (e.out_fnv[k].some((x, i) => outFnv[k][i] !== x)) { why = k; break; } }
    if (!why && JSON.stringify(tf.decode(s.heads()).ids) === JSON.stringify(tokens)) decodedOk++;
    // P2.16: the engine's top-K (zf_tajweed_stream_topk) == the SDK's ranking, every rankable head, k 2 and all
    if (!why && expected.indexOf(e) % 7 === 0) {
      const take = s.heads();
      for (const [name, cols] of Object.entries(pkg.RANKED_HEADS)) for (const k of [2, cols]) {
        const a = s.topK(name, k), b = pkg.topK(take, name, k);
        if (!a || a.ids.some((x, i) => x !== b.ids[i]) || a.values.some((x, i) => x !== b.values[i]) || a.margins.some((x, i) => x !== b.margins[i])) why = `topK ${name} ${k}`;
      }
      if (!why) topkOk++;
    }
    if (why) bad.push(`${e.clip}: ${why}`); else ok++;
  }
  s.free();
  chunkTimes.sort((x, y) => x - y);
  result.conformance = { ok, n: expected.length, bad, decodedIdsEqualGreedy: decodedOk, engineTopKEqualsSdk: topkOk };
  result.speed = { firstChunkMs, chunkMedianMs: chunkTimes[chunkTimes.length >> 1], chunkP95Ms: chunkTimes[Math.floor(chunkTimes.length * 0.95)],
    chunks: chunkTimes.length, rtf: computeMs / 1000 / audioSeconds };
  log(`conformance ${ok}/${expected.length}; chunk median ${result.speed.chunkMedianMs.toFixed(1)} ms, RTF ${result.speed.rtf.toFixed(3)}`);
  tf.free();

  // ---- the reference's scorer vectors through @quran-lab/tajweedformer/scorer ----
  const { TajweedFormer: Scorer, sha256Hex } = await import('/pkg/web/scorer.js');
  const get = async (p) => new Uint8Array(await (await fetch('/fixture/' + p)).arrayBuffer());
  const fx = JSON.parse(new TextDecoder().decode(await get('vectors.json')));
  const model = { 'calibration.json': await get('model/calibration.json'), 'tokens.txt': await get('model/tokens.txt'), 'expected_tj3.zfx': await get('model/expected_tj3.zfx') };
  const cal = JSON.parse(new TextDecoder().decode(model['calibration.json']));
  const list = [];
  for (const [p, d] of Object.entries(model)) list.push({ path: p, size: d.length, sha256: await sha256Hex(d) });
  const man = { format: 2, model_id: cal.model_id, family: 'tajweedformer', revision: 'fixture', min_sdk_version: '2.0.0', engine_format: 2, coreml_format: 9,
    tokens_sha256: await sha256Hex(model['tokens.txt']), coreml: '-', sidecar: '-', keeps: '-', tokens: 'tokens.txt', files: list };
  const files = { ...model, 'manifest.json': new TextEncoder().encode(JSON.stringify(man)) };
  const layers = await (await fetch('/layers.json')).json();
  const L = new Map(layers.vectors.map((x) => [`${x.context}/${x.name}`, x]));
  const models = new Map();
  let vok = 0, vn = 0, layerBad = 0;
  const vbad = [];
  const near = (a, b, tol) => (a === null || b === null ? a === b : Math.abs(a - b) <= tol);
  for (const v of fx.vectors) {
    if (!models.has(v.context)) models.set(v.context, await Scorer.load({ files, context: v.context }));
    const sc = models.get(v.context);
    const raw = await get(v.heads);
    const all = new Float32Array(raw.buffer, raw.byteOffset, raw.byteLength / 4);
    const heads = { n40: v.n40, n20: v.n20, vocab: 38 };
    let at = 0;
    fx.head_order.forEach((name, i) => { const n = (fx.head_ms[i] === 40 ? v.n40 : v.n20) * fx.head_widths[i]; heads[camel(name)] = all.slice(at, at + n); at += n; });
    const ref = L.get(`${v.context}/${v.name}`);
    const d = sc.decode(heads);
    if (JSON.stringify(d.ids) !== JSON.stringify(ref.decoded.tokens.map((x) => x.id)) || d.tokens.some((x, i) => !near(x.confidence, ref.decoded.tokens[i].confidence, 1e-9))) layerBad++;
    for (const [preset, refFile] of Object.entries(v.refs)) {
      sc.setRemoteConfig(fx.presets[preset]);
      const r = await sc.score(heads, v.surah, v.ayah, { backend: 'fp32' });
      const want = JSON.parse(new TextDecoder().decode(await get(refFile)));
      const why = [];
      if (JSON.stringify(r.raw.path) !== JSON.stringify(want.path)) why.push('path');
      else want.sites.forEach((ws, i) => {
        const cs = r.raw.sites[i];
        if (!cs || !!cs.flagged !== !!ws.flagged || cs.class !== ws.class) why.push(`site ${ws.i} verdict`);
        for (const [cls, p] of Object.entries(ws.per_class)) {
          const c = cs && cs.per_class[cls];
          if (!c || !!c.flagged !== !!p.flagged) { why.push(`site ${ws.i} ${cls} flag`); continue; }
          for (const f of ['llr_log_probs', 'llr_inter1', 'fused']) if (!near(c[f], p[f], 1e-3)) why.push(`site ${ws.i} ${cls} ${f}`);
        }
      });
      for (const part of ['madd', 'qalqalah', 'gemination']) {
        const a = (r.raw[part] && r.raw[part].items) || [], b = (want[part] && want[part].items) || [];
        if (a.length !== b.length || a.some((x, i) => !!x.flagged !== !!b[i].flagged)) why.push(part);
      }
      const ws = ref.words[preset];
      if (r.words.length !== ws.length || r.words.some((w, i) => !near(w.score, ws[i].score, 1e-9))) { why.push('word scores'); layerBad++; }
      vn++;
      if (why.length) vbad.push(`${v.context}/${v.name} ${preset}: ${why.slice(0, 3).join('; ')}`); else vok++;
    }
  }
  for (const m of models.values()) m.free();
  result.vectors = { ok: vok, n: vn, bad: vbad };
  result.layers = { bad: layerBad };
  log(`vectors ${vok}/${vn}, layers bad ${layerBad}`);
} catch (e) {
  result.error = String(e && e.stack || e);
  log('ERROR ' + result.error);
}
window.__done = true;
</script>
</body>
</html>
