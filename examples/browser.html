<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TajweedFormer example</title>
<style>
  :root { --bg: #fdfcf8; --fg: #1c1b19; --accent: #2a3b8f; --muted: #6b675e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --fg: #f3f1ea; --accent: #8fa2ff; --muted: #a8a397; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; max-width: 52rem; }
  button, input { font: inherit; }
  button { padding: .5rem 1rem; border: 2px solid var(--accent); border-radius: 10px; background: var(--accent); color: #fff; }
  #heard span { display: inline-block; margin: 2px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--muted); }
  .low { opacity: .5; } .flag { outline: 2px solid #d33; }
  pre { white-space: pre-wrap; color: var(--muted); }
</style>
</head>
<body>
<h1>TajweedFormer V4</h1>
<p>Key <input id="key" size="40" placeholder="qlk_v1_... (a web key for this origin)">
   Surah <input id="surah" value="1" size="3"> Ayah <input id="ayah" value="1" size="3"></p>
<p><button id="go">Load and listen</button> <button id="stop" disabled>Stop and score</button></p>
<pre id="status"></pre>
<div id="heard"></div>
<div id="words"></div>
<quranlab-sharing-settings></quranlab-sharing-settings>
<script type="module">
import { TajweedFormer } from '../web/index.js';
import { QuranLab } from '../web/platform/index.js';
import { enableSharing } from '../web/consent/index.js';

const $ = (id) => document.getElementById(id);
const status = (s) => { $('status').textContent = s; };
let tf, stream, ctx, node, src;

$('go').onclick = async () => {
  const ql = await QuranLab.configure({ key: $('key').value.trim(), appVersion: 'example', contributions: true });
  if (ql.stopped) { status(`the platform refused this key: ${ql.stopped}`); return; }
  ql.startRefresh();
  const sharing = enableSharing(ql);
  document.querySelector('quranlab-sharing-settings').controller = sharing;
  ctx = new AudioContext();
  tf = tf || await TajweedFormer.load({ platform: ql, sampleRate: ctx.sampleRate,
    onProgress: (p) => status(`${p.path}: ${(100 * p.loaded / p.total).toFixed(0)}%${p.cached ? ' (cached)' : ''}`) });
  status(`model ${tf.info.modelId} at ${tf.context}, ${tf.delivery.bytesDownloaded} bytes downloaded`);
  stream = tf.createStream({ onChunk: () => {
    const d = stream.decoded();
    $('heard').innerHTML = d.tokens.map((t) => `<span class="${t.confidence !== null && t.confidence < 0.6 ? 'low' : ''}" title="runner-up ${t.runnerUpUnit}, margin ${t.margin.toFixed(2)}">${t.unit}</span>`).join('');
  } });
  const mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  src = ctx.createMediaStreamSource(mic);
  node = ctx.createScriptProcessor(4096, 1, 1);  // an AudioWorklet in production
  node.onaudioprocess = (e) => stream.pushAudio(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(node); node.connect(ctx.destination);
  $('stop').disabled = false;
};

$('stop').onclick = async () => {
  node.disconnect(); src.disconnect();
  stream.finish();
  const r = await tf.score(stream.heads(), Number($('surah').value), Number($('ayah').value));
  $('words').innerHTML = r.words.map((w) => `<span class="${w.flagged ? 'flag' : ''}">word ${w.word + 1}: ${w.score === null ? '-' : w.score.toFixed(1)}</span>`).join(' ');
  status(`${r.summary.flagged} of ${r.summary.sites} sites flagged; ${r.summary.wordsFlagged} words flagged`);
  stream.free();
  $('stop').disabled = true;
};
</script>
</body>
</html>
