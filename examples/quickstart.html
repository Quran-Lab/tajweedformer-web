<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TajweedFormer quick start</title>
<!-- The README's quick start as a page you can run (SDK 4.0, API 4): microphone in, what the model heard out; and
     the same from a sample clip of the model, with no microphone.
     The loader is Quran Lab's hosted script; it opens Quran Lab's frame on this page (the model, its key and its
     files stay in that frame). Serve the page from https or http://localhost, from an origin your web key allows;
     with a Content-Security-Policy, add the README's lines. The script between the two README markers below is the
     README's "Quick start", character for character. -->
<script src="https://web.quranlab.ai/4/loader.js" crossorigin="anonymous"></script>
</head>
<body>
<button id="listen">Listen</button>
<button id="clip">Play a sample clip</button>
<pre id="heard"></pre>
<script type="module">
// README:begin
const client = await QuranLab.TajweedClient.create({ key: 'qlk_v1_...' });   // your web key from sdk.quranlab.ai
const model = await client.model();                 // the first visit downloads the model once for your site
async function take(from) {                         // one take: the microphone, or a sample clip
  const session = await model.listen({ from, endOnSilenceMs: 1500 });   // ends when the learner stops
  for await (const chunk of session.chunks) document.querySelector('#heard').textContent = chunk.decoded.text;
}
document.querySelector('#listen').onclick = () => take();                // the microphone needs a tap
// README:end

// no microphone: a sample clip of the model through the same path
document.querySelector('#clip').onclick = () => take(model.sampleClips[0]);
</script>
</body>
</html>
